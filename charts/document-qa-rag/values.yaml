replicaCount: 2

image:
  repository: marvetech/document-qa-rag-system
  tag: "0.1.0"
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: ""
  annotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: false
  className: ""
  hosts:
    - host: document-qa-rag.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

app:
  authMode: oidc
  authTenantClaim: tenant_id
  authRolesClaim: roles
  jwtIssuer: document-qa-rag
  jwtSecret: change-me-change-me-change-me-change-me
  oidcIssuerUri: ""
  oidcJwkSetUri: ""
  datasourceUrl: jdbc:postgresql://document-qa-rag-postgresql:5432/ragdb
  datasourceUsername: rag
  datasourcePassword: rag
  storageProvider: database
  storageS3Bucket: ""
  storageS3Region: us-east-1
  storageS3Endpoint: ""
  storageS3AccessKey: ""
  storageS3SecretKey: ""
  storageS3PathStyleAccess: false
  ingestionMode: kafka
  kafkaBootstrapServers: document-qa-rag-kafka:9092
  vectorStore: pgvector
  embeddingProvider: local
  generationProvider: local
  openAiApiKey: ""
  openAiBaseUrl: https://api.openai.com
  openAiEmbeddingModel: text-embedding-3-small
  openAiChatModel: gpt-4o-mini
  openAiChatMaxTokens: 500

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: false
  ingressNamespaceSelector: {}
  ingressPodSelector: {}

postgresql:
  enabled: true
  image: pgvector/pgvector:pg16
  storage: 5Gi

redis:
  enabled: true
  image: redis:7-alpine

kafka:
  enabled: true
  image: bitnami/kafka:3.7
